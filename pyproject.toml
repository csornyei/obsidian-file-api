[project]
name = "obsidian-file-api"
version = "0.1.1"
description = "File API for Obsidian vaults using FastAPI"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "fastapi[standard]>=0.121.1",
    "structlog>=25.5.0",
    "pyyaml>=6.0.3",
    "pydantic-settings>=2.14.1",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pre-commit>=4.4.0",
    "pytest>=9.0.0",
    "pytest-asyncio>=1.3.0",
    "pytest-cov>=7.0.0",
    "ruff>=0.15.9",
    "ty>=0.0.29",
]

monitoring = [
    "opentelemetry-distro[otlp]>=0.62b0",
    "opentelemetry-instrumentation-httpx>=0.62b0",
    "opentelemetry-instrumentation-logging>=0.62b0",
    "opentelemetry-instrumentation-fastapi>=0.62b0",
]

[tool.isort]
profile = "black"
line_length = 100
